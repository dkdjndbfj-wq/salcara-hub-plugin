name: Plugin source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/salcara-hub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: plugins/salcara-hub/go.mod
          cache-dependency-path: plugins/salcara-hub/go.sum
      - run: go test ./...
      - run: go vet ./...
