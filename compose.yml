name: salcara-hub-standalone
services:
  hub:
    image: salcara-hub-standalone:local
    build:
      context: .
      dockerfile: Dockerfile
    user: "65532:65532"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      SALCARA_HUB_LISTEN: ":8787"
      SALCARA_HUB_DATA_DIR: /data
      SALCARA_HUB_ADMIN_TOKEN_FILE: /data/admin-token
      SALCARA_HUB_PUBLIC_URL: "${SALCARA_HUB_PUBLIC_URL:?Set the HTTPS site URL ending in /salcara-hub}"
      # Parent launcher only; the supervised Hub sets its own soft target.
      GOMEMLIMIT: 32MiB
      GOMAXPROCS: "2"
    volumes:
      - hub-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  hub-data:
