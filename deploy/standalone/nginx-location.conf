# Paste ONLY these locations inside the existing HTTPS server{} for your site.
# This assumes Nginx runs on the HOST. A containerized Nginx needs a private
# Docker network + proxy_pass http://hub:8787 instead of container localhost.
# Do not replace existing /v1/, /api/, / or TLS configuration.
location = /salcara-hub {
    access_log off;
    return 308 /salcara-hub/;
}

location ^~ /salcara-hub/ {
    # Sub2API 0.2.11 automatically appends its login token to iframe URLs.
    # Never log $request / $request_uri / $args here. The Hub strips page queries.
    access_log off;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite (never append) with the real peer so a client cannot spoof it.
    # The Hub uses it only for failed-login rate limits (SALCARA_HUB_TRUST_PROXY).
    # Behind Cloudflare or another CDN, configure ngx_http_realip_module first.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    client_max_body_size 3m;
    # The Hub supplies frame-ancestors 'self' + SAMEORIGIN for its HTML pages.
    # Do not add a conflicting X-Frame-Options DENY / frame-ancestors 'none'.
    # Keep Authorization and X-Salcara-* headers intact; never put secrets in URLs.
}
